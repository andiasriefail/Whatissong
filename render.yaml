services:
  - type: web
    name: whatissong
    runtime: python
    buildCommand: |
      apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: AUDD_API_KEY_1
        sync: false
      - key: AUDD_API_KEY_2
        sync: false
      - key: AUDD_API_KEY_3
        sync: false
      - key: WEB_API_KEY
        sync: false
      - key: CF_PAGES_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
